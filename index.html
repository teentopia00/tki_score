<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>나의 스트레스 패턴 진단과 대응 전략짜기</title>
<style>
:root{--ink:#16201c;--muted:#5f6d66;--line:#d9e0dc;--paper:#fbfcfb;--panel:#fff;--accent:#2f6f5e;--accent-strong:#174f42;--warm:#c96d3f;--gold:#d49b2a;--blue:#406ea8;--shadow:0 18px 45px rgba(19,33,28,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(120deg,rgba(47,111,94,.08),transparent 34%),linear-gradient(300deg,rgba(201,109,63,.09),transparent 36%),var(--paper);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}button,input{font:inherit}.app{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:32px 0 56px}.workspace{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - 64px);overflow:hidden;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.78);box-shadow:var(--shadow)}aside{display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:32px;border-right:1px solid var(--line);background:#f3f7f4}.kicker{margin:0 0 10px;color:var(--accent);font-size:.78rem;font-weight:800;text-transform:uppercase}h1{margin:0;font-size:clamp(2.1rem,4vw,3.75rem);line-height:1.05}h2,h3{letter-spacing:0}.intro{margin:18px 0 0;color:var(--muted);line-height:1.7}.scale{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;color:var(--muted);font-size:.9rem}.scale span{display:grid;place-items:center;width:28px;height:28px;border-radius:999px;background:var(--panel);color:var(--accent);font-weight:800}.scale p{margin:4px 0 0}.panel{display:flex;flex-direction:column;min-width:0;padding:26px}.questions{display:grid;gap:14px;align-content:start;overflow:auto;padding-right:4px}.section{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin:10px 0 2px;padding-top:8px}.section h2{margin:0;font-size:1.2rem}.section p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.5;text-align:right}.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.idx{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:26px;margin-bottom:8px;border-radius:999px;background:#edf4f0;color:var(--accent);font-size:.82rem;font-weight:800}.card p{margin:0;line-height:1.58;word-break:keep-all}.rating{display:grid;grid-template-columns:repeat(5,42px);gap:7px}.rating input{position:absolute;opacity:0;pointer-events:none}.rating label{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:999px;background:#f8faf8;color:var(--muted);cursor:pointer;font-weight:800;transition:.15s}.rating label:hover{transform:translateY(-1px);border-color:var(--accent)}.rating input:checked+label{border-color:var(--accent);background:var(--accent);color:#fff}.progress{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.progress-label{display:flex;justify-content:space-between;margin-bottom:12px;color:var(--muted);font-weight:700}.track{height:10px;overflow:hidden;border-radius:999px;background:#e5ece8}.bar{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--warm));transition:width .18s ease}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}button{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--accent);cursor:pointer;font-weight:800}.primary{background:var(--accent);color:#fff}.primary:disabled{border-color:#c9d1cd;background:#c9d1cd;color:#738078;cursor:not-allowed}.ghost{background:#fff;color:#174f42}.result{margin-top:24px;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px;padding:28px;border-bottom:1px solid var(--line)}.badge{display:inline-flex;width:fit-content;margin-bottom:14px;padding:7px 11px;border-radius:999px;background:#edf4f0;color:#174f42;font-weight:900}.hero h2{margin:0;font-size:clamp(2rem,5vw,4.5rem);line-height:.98}.hero p{margin:16px 0 0;color:var(--muted);line-height:1.72}.axis{display:grid;gap:12px;align-content:center}.axis-row{padding:14px;border:1px solid var(--line);border-radius:8px;background:#fbfcfb}.axis-row strong{display:block;margin-bottom:8px}.meter{height:9px;overflow:hidden;border-radius:999px;background:#e8eeea}.meter span{display:block;width:var(--value);height:100%;border-radius:inherit;background:var(--color,var(--accent))}.content{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:28px}.block ul{display:grid;gap:10px;margin:0;padding-left:20px;color:var(--muted);line-height:1.65}.matrix{grid-column:1/-1}.matrix h3,.scores h3{margin:0 0 12px;font-size:1.08rem}.grid{display:grid;grid-template-columns:130px repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fbfcfb}.corner,.head,.row,.cell{min-width:0;padding:14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.corner,.head,.row{display:grid;align-items:center;background:#f3f7f4;color:var(--muted);font-size:.88rem;font-weight:900}.head{text-align:center}.cell{display:grid;gap:5px;background:#fff}.cell span{color:var(--muted);font-size:.88rem}.cell em{width:fit-content;margin-top:4px;padding:4px 8px;border-radius:999px;background:var(--cell);color:#fff;font-size:.76rem;font-style:normal;font-weight:900}.cell.win{border:2px solid var(--cell);background:#fff9ef}.scores{grid-column:1/-1;display:grid;gap:10px}.score{display:grid;grid-template-columns:120px minmax(0,1fr) 42px;gap:12px;align-items:center}.result-buttons{display:flex;flex-wrap:wrap;gap:10px;padding:0 28px 28px}.toast{color:#174f42;font-weight:800}.source{padding:18px 4px 0;color:var(--muted);font-size:.9rem;line-height:1.5}@media(max-width:860px){.app{width:min(100% - 20px,680px);padding-top:10px}.workspace,.hero,.content{grid-template-columns:1fr}.workspace{min-height:auto}aside{border-right:0;border-bottom:1px solid var(--line);padding:24px}.panel{padding:18px}.section{display:block}.section p{margin-top:6px;text-align:left}.card{grid-template-columns:1fr}.rating{grid-template-columns:repeat(5,minmax(38px,1fr))}.rating label{width:100%}.grid{grid-template-columns:1fr}.corner,.head{display:none}.row,.cell{border-right:0}.actions{position:sticky;bottom:0;background:var(--panel)}}@media(max-width:480px){.app{width:100%;padding:0}.workspace,.result{border-left:0;border-right:0;border-radius:0}aside,.hero,.content,.result-buttons{padding:20px}h1{font-size:2.15rem}.card{padding:15px}.score{grid-template-columns:92px minmax(0,1fr) 36px}}
</style>
</head>
<body>
<main class="app"><section class="workspace" aria-labelledby="app-title"><aside><div><p class="kicker">Stress Pattern Check</p><h1 id="app-title">나의 스트레스 패턴 진단과 대응 전략짜기</h1><p class="intro">지금 스트레스를 어떤 반향으로 해석하고 반응하는지를 진단합니다. 아래의 26가지 질문에 5점 척도로 응답하세요.</p></div><div class="scale"><span>1</span><p>전혀 아니다</p><span>5</span><p>매우 그렇다</p></div></aside><section class="panel"><div id="questions" class="questions"></div><div class="progress" aria-live="polite"><div class="progress-label"><span id="progressText">0 / 26</span><span id="progressPercent">0%</span></div><div class="track"><div id="progressBar" class="bar"></div></div></div><div class="actions"><button id="reset" class="ghost" type="button">초기화</button><button id="show" class="primary" type="button" disabled>결과 보기</button></div></section></section><section id="result" class="result" hidden aria-live="polite"></section><footer class="source">출처: Harvard Business Review, “The Power of Knowing Your Stress Patterns”</footer></main>
<script>
const sections=[['1단계: 스트레스를 어떻게 해석하나요?','기회로 보는지, 위협으로 보는지 확인합니다.'],['2단계: 압박이 오면 어떻게 움직이나요?','침착하게 정리하는지, 빠르게 행동하는지 확인합니다.'],['3단계: 가장 닮은 패턴을 찾습니다.','6가지 패턴별 문항입니다.']];
const q=[[0,'예상치 못한 위기가 생기면 이 상황을 통해 배우고 성장할 수 있겠다는 생각이 먼저 든다.','axis','opportunity'],[0,'큰 압박이 올 때 망치면 안 된다, 위험하다는 생각이 먼저 떠올라 방어적으로 된다.','axis','threat'],[0,'새로운 도전 과제가 생기면 부담감보다 흥분과 호기심이 더 크다.','axis','opportunity'],[0,'스트레스가 쌓이면 실수, 비난, 손실을 피하는 데 에너지가 더 많이 쏟아진다.','axis','threat'],[1,'긴급한 상황에서도 표정, 목소리, 행동이 크게 흔들리지 않고 주변 사람에게 차분하게 보인다.','axis','composed'],[1,'스트레스가 오면 몸이 먼저 반응한다. 바로 움직이고 전화하고 지시하며 자리에 앉아 있기 어렵다.','axis','dynamic'],[1,'어려운 문제를 만나면 먼저 한 걸음 물러나 상황을 정리하고 정보를 수집하려 한다.','axis','composed'],[1,'긴급 상황이 오면 곧바로 현장으로 뛰어들어 손으로 해결하는 것이 자연스럽다.','axis','dynamic'],[2,'위기 상황에서 사람들이 나를 보면 안정감을 얻는다는 말을 자주 듣는다.','pattern','lighthouse'],[2,'스트레스가 커질수록 말을 줄이고 핵심을 정리해 조용한 방향을 제시한다.','pattern','lighthouse'],[2,'주변이 흔들릴 때도 우리가 통제할 수 있는 것을 보자는 생각을 먼저 한다.','pattern','lighthouse'],[2,'압박 속에서도 이 위기를 새로운 기회나 아이디어로 바꿀 수 있을지 떠올린다.','pattern','alchemist'],[2,'침착함을 유지하면서도 동시에 실험, 전환, 시도 계획을 세우는 편이다.','pattern','alchemist'],[2,'제약이 있을수록 창의성이 더 살아난다는 말을 들어본 적이 있다.','pattern','alchemist'],[2,'갑작스러운 위기나 마감이 생기면 긴장되지만 한편으로는 충전되는 느낌이 든다.','pattern','firefighter'],[2,'평상시보다 위기 상황에서 집중력과 속도가 더 좋아진다.','pattern','firefighter'],[2,'위기가 끝난 뒤에는 지치거나 일상적인 관리가 어렵게 느껴질 때가 있다.','pattern','firefighter'],[2,'스트레스 상황에서 감정을 크게 드러내기보다 원칙, 규율, 절차로 버틴다.','pattern','stoic'],[2,'위기 때는 차분한 사고와 억제가 중요하다고 믿으며 감정 표현을 줄이는 편이다.','pattern','stoic'],[2,'속으로는 긴장해도 겉으로는 최대한 평온한 태도를 유지하려 한다.','pattern','stoic'],[2,'갈등이나 스트레스가 심해질수록 사람들 사이를 중재하고 신뢰를 지키는 데 신경 쓴다.','pattern','diplomat'],[2,'내 입장을 빨리 정하기보다 각자의 이야기를 듣고 균형을 맞추려 한다.','pattern','diplomat'],[2,'상대의 입장과 감정을 살피다가 내 부담을 숨기고 지칠 때가 있다.','pattern','diplomat'],[2,'스트레스가 커질수록 체계, 체크리스트, 구조를 만들고 관리하고 싶어진다.','pattern','container'],[2,'긴장하면 머릿속이 빠르게 돌아가며 일정, 우선순위, 계획을 업데이트한다.','pattern','container'],[2,'모든 것을 통제하려다가 과로하거나 피로감이 커질 때가 있다.','pattern','container']];
const patterns={lighthouse:{n:'등대형',e:'Lighthouse',t:['침착','기회'],c:'#2f6f5e',s:'압박이 커질수록 안정감을 만들고 방향을 제시합니다. 사람들은 당신을 기준점처럼 느낄 가능성이 큽니다.',a:['오늘의 통제 가능 영역 3가지를 적습니다.','주변 사람에게 지금 필요한 한 문장 방향을 공유합니다.','몸의 긴장을 확인하고 5분간 호흡이나 산책으로 회복 시간을 만듭니다.'],g:['혼란 속에서 우선순위를 정리합니다.','감정의 파도에 휩쓸리지 않고 신뢰를 줍니다.'],r:['본인의 부담을 늦게 알아차릴 수 있습니다.','빠른 실행이 필요한 순간에 신중함이 길어질 수 있습니다.']},alchemist:{n:'연금술사형',e:'Alchemist',t:['침착','역동','기회'],c:'#d49b2a',s:'압박을 재료로 삼아 새로운 방법을 찾습니다. 차분함과 실험성이 함께 움직이는 패턴입니다.',a:['새로운 시도는 하나만 고르고 24시간 안에 검증합니다.','가장 큰 리스크 1개와 중단 기준 1개를 적습니다.','실험 전후에 에너지 수준을 점검합니다.'],g:['제약을 아이디어의 연료로 바꿉니다.','혼란 속에서도 시도 가능한 선택지를 만듭니다.'],r:['너무 많은 실험을 동시에 열어 피로해질 수 있습니다.','위험 신호를 낙관으로 덮을 수 있습니다.']},firefighter:{n:'소방수형',e:'Firefighter',t:['역동','기회'],c:'#c96d3f',s:'위기가 오면 빠르게 현장으로 뛰어듭니다. 급박한 상황에서 집중력과 실행력이 올라옵니다.',a:['대응 전 90초 동안 목표, 사람, 다음 행동을 정리합니다.','위기 종료 후 회복 시간을 일정에 먼저 넣습니다.','반복되는 불씨를 체크리스트로 남겨 다음 위기를 줄입니다.'],g:['즉각 대응이 필요한 순간에 강합니다.','마감과 위기 속에서 추진력을 냅니다.'],r:['위기 이후 회복을 놓치면 번아웃이 빨리 옵니다.','평상시의 느린 관리 업무가 미뤄질 수 있습니다.']},stoic:{n:'스토익형',e:'Stoic',t:['침착','위협'],c:'#406ea8',s:'압박을 위협으로 인식하지만 겉으로는 흔들리지 않으려 합니다. 원칙과 절제가 방어막이 됩니다.',a:['지금 느끼는 감정을 한 단어로 적고 신뢰할 사람에게 공유합니다.','원칙을 지키되 예외 처리 기준을 하나 만듭니다.','잠깐의 회복을 의무처럼 일정에 넣습니다.'],g:['어려운 상황에서도 절차와 기준을 지킵니다.','위험을 가볍게 보지 않습니다.'],r:['감정을 억누르다가 고립될 수 있습니다.','도움을 요청하는 타이밍이 늦어질 수 있습니다.']},diplomat:{n:'외교관형',e:'Diplomat',t:['침착','역동','위협'],c:'#b75267',s:'스트레스가 관계와 갈등으로 번질 때 균형을 맞추려 합니다. 사람 사이의 신뢰를 지키는 데 민감합니다.',a:['내 입장, 상대 입장, 공동 목표를 각각 한 줄로 분리합니다.','오늘 내가 책임질 것과 책임지지 않을 것을 구분합니다.','중재 전에 나의 한계와 요청을 먼저 정합니다.'],g:['갈등 상황에서 대화의 안전감을 만듭니다.','여러 입장을 듣고 공정한 접점을 찾습니다.'],r:['모두를 배려하다가 본인의 입장이 흐려질 수 있습니다.','타인의 감정을 떠안아 지칠 수 있습니다.']},container:{n:'컨테이너형',e:'Container',t:['역동','위협'],c:'#6d5c96',s:'압박이 커질수록 구조와 계획을 만들어 불안을 담아내려 합니다. 복잡한 일을 정리하는 힘이 큽니다.',a:['반드시 관리해야 할 3가지만 남기고 나머지는 보류합니다.','계획표에 담당자와 마감뿐 아니라 휴식 지점도 넣습니다.','완벽한 통제보다 다음 30분의 실행을 우선합니다.'],g:['혼란을 일정, 역할, 우선순위로 바꿉니다.','빠르게 변수와 의존관계를 파악합니다.'],r:['모든 것을 통제하려다 과로할 수 있습니다.','계획을 고치는 데 에너지가 과하게 쓰일 수 있습니다.']}};
const matrix=[['기회로 해석',['lighthouse','alchemist','firefighter']],['위협으로 감지',['stoic','diplomat','container']]],answers=new Map(),qa=document.querySelector('#questions'),show=document.querySelector('#show'),result=document.querySelector('#result');
function render(){qa.innerHTML='';sections.forEach((s,si)=>{qa.insertAdjacentHTML('beforeend',`<div class="section"><h2>${s[0]}</h2><p>${s[1]}</p></div>`);q.filter(x=>x[0]===si).forEach(x=>{const i=q.indexOf(x)+1;qa.insertAdjacentHTML('beforeend',`<article class="card"><div><span class="idx">Q${i}</span><p>${x[1]}</p></div><div class="rating" role="radiogroup" aria-label="문항 ${i} 점수">${[1,2,3,4,5].map(v=>`<input id="q${i}-${v}" type="radio" name="q${i}" value="${v}"><label for="q${i}-${v}">${v}</label>`).join('')}</div></article>`);});});document.querySelectorAll('input').forEach(el=>el.addEventListener('change',()=>{answers.set(Number(el.name.slice(1)),Number(el.value));save();progress();}));}
function progress(){const n=answers.size,p=Math.round(n/q.length*100);document.querySelector('#progressText').textContent=`${n} / ${q.length}`;document.querySelector('#progressPercent').textContent=`${p}%`;document.querySelector('#progressBar').style.width=p+'%';show.disabled=n!==q.length;}
function calc(){const axis={opportunity:0,threat:0,composed:0,dynamic:0},pt=Object.fromEntries(Object.keys(patterns).map(k=>[k,0]));q.forEach((x,i)=>{const v=answers.get(i+1)||0;if(x[2]==='axis')axis[x[3]]+=v;else pt[x[3]]+=v;});const od=axis.opportunity>=axis.threat?'opportunity':'threat',md=axis.composed>=axis.dynamic?'composed':'dynamic';const bonus={lighthouse:(od==='opportunity'?2:0)+(md==='composed'?2:0),alchemist:od==='opportunity'?2:0,firefighter:(od==='opportunity'?2:0)+(md==='dynamic'?2:0),stoic:(od==='threat'?2:0)+(md==='composed'?2:0),diplomat:od==='threat'?2:0,container:(od==='threat'?2:0)+(md==='dynamic'?2:0)};const total=Object.fromEntries(Object.entries(pt).map(([k,v])=>[k,v+bonus[k]]));const win=Object.entries(total).sort((a,b)=>b[1]-a[1])[0][0];return{axis,total,win,od,md};}
function list(title,arr){return `<div class="block"><h3>${title}</h3><ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
function renderMatrix(win){return matrix.map(row=>`<div class="row">${row[0]}</div>${row[1].map(k=>{const p=patterns[k],w=k===win;return `<div class="cell ${w?'win':''}" style="--cell:${p.c}"><strong>${p.n}</strong><span>${p.e}</span>${w?'<em>최종 패턴</em>':''}</div>`}).join('')}`).join('')}
function renderResult(){const r=calc(),p=patterns[r.win],mind=r.axis.opportunity+r.axis.threat,motion=r.axis.composed+r.axis.dynamic,op=Math.round(r.axis.opportunity/mind*100),co=Math.round(r.axis.composed/motion*100),sorted=Object.entries(r.total).sort((a,b)=>b[1]-a[1]),max=Math.max(...Object.values(r.total));result.hidden=false;result.innerHTML=`<div class="hero"><div><span class="badge">${p.e} · 대표 경향: ${p.t.join(' · ')}</span><h2>${p.n}</h2><p>${p.s}</p></div><div class="axis"><div class="axis-row"><strong>${r.od==='opportunity'?'기회 해석이 더 강함':'위협 감지가 더 강함'}</strong><div class="meter"><span style="--value:${op}%;--color:var(--gold)"></span></div><p>기회 ${r.axis.opportunity}점 · 위협 ${r.axis.threat}점</p></div><div class="axis-row"><strong>${r.md==='composed'?'침착 반응이 더 강함':'역동 반응이 더 강함'}</strong><div class="meter"><span style="--value:${co}%;--color:var(--blue)"></span></div><p>침착 ${r.axis.composed}점 · 역동 ${r.axis.dynamic}점</p></div></div></div><div class="content">${list('강점',p.g)}${list('주의할 점',p.r)}${list('오늘 바로 할 행동',p.a)}${list('결과 읽기',['이 진단은 의료 진단이 아니라 자기이해를 돕는 체크입니다.','점수가 비슷한 2순위 패턴도 상황에 따라 함께 나타날 수 있습니다.','스트레스가 일상 기능을 방해한다면 전문가와 상담하는 것이 좋습니다.'])}<div class="matrix"><h3>최종 점수 매트릭스</h3><div class="grid"><div class="corner">해석 / 반응</div><div class="head">침착</div><div class="head">침착+역동</div><div class="head">역동</div>${renderMatrix(r.win)}</div></div><div class="scores"><h3>6가지 패턴 점수</h3>${sorted.map(([k,v])=>`<div class="score"><strong>${patterns[k].n}</strong><div class="meter"><span style="--value:${Math.max(8,Math.round(v/max*100))}%;--color:${patterns[k].c}"></span></div><span>${v}</span></div>`).join('')}</div></div><div class="result-buttons"><button id="copy" class="primary" type="button">결과 복사</button><button id="retake" class="ghost" type="button">다시 진단</button><span id="toast" class="toast"></span></div>`;document.querySelector('#retake').onclick=reset;document.querySelector('#copy').onclick=copy;result.scrollIntoView({behavior:'smooth',block:'start'});}
async function copy(){const r=calc(),p=patterns[r.win];await navigator.clipboard.writeText([`나의 스트레스 패턴: ${p.n} (${p.e})`,p.s,'','오늘 바로 할 행동',...p.a.map(x=>'- '+x)].join('\n'));document.querySelector('#toast').textContent='복사되었습니다.';}
function save(){localStorage.setItem('stressPatternAnswers',JSON.stringify(Object.fromEntries(answers)));}function restore(){Object.entries(JSON.parse(localStorage.getItem('stressPatternAnswers')||'{}')).forEach(([k,v])=>answers.set(Number(k),Number(v)));answers.forEach((v,k)=>{const el=document.querySelector(`#q${k}-${v}`);if(el)el.checked=true;});}function reset(){answers.clear();localStorage.removeItem('stressPatternAnswers');document.querySelectorAll('input').forEach(x=>x.checked=false);result.hidden=true;result.innerHTML='';progress();scrollTo({top:0,behavior:'smooth'});}document.querySelector('#reset').onclick=reset;show.onclick=renderResult;render();restore();progress();
</script>
</body>
</html>
