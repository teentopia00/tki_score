<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>갈등관리유형 진단 통계 앱</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--primary:#111827;--accent:#2563eb;--soft:#f3f4f6;--warn:#fff7ed;--warn-line:#fed7aa}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 80px}header{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:18px}
h1{margin:0;font-size:32px;letter-spacing:-.03em}h2{margin:0 0 14px;font-size:22px}h3{margin:0 0 8px;font-size:18px}p{line-height:1.65}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:13px;background:#111827;color:white;margin-bottom:10px}.sub{color:var(--muted);margin:7px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 6px 18px rgba(17,24,39,.05);margin-bottom:16px}.warn{background:var(--warn);border-color:var(--warn-line)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:white;font-size:15px}
.buttons{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:14px;padding:11px 15px;background:var(--primary);color:white;cursor:pointer;font-weight:700}button.secondary{background:white;color:var(--text);border:1px solid var(--line)}button.blue{background:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:8px;margin:18px 0}.tab{flex:1;background:white;border:1px solid var(--line);color:var(--text)}.tab.active{background:var(--primary);color:white}
.progressbar{height:13px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progressbar>div{height:100%;background:var(--primary);transition:.25s}
.q{display:grid;grid-template-columns:70px 1fr;gap:16px;align-items:start}.qnum{font-weight:900;font-size:20px;background:var(--soft);border-radius:15px;padding:12px;text-align:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{display:block;text-align:left;width:100%;background:white;color:var(--text);border:1px solid var(--line);border-radius:18px;padding:15px;min-height:92px}.choice.selected{background:var(--primary);color:white;border-color:var(--primary)}.choice strong{display:block;margin-bottom:8px}
.sticky{position:sticky;bottom:12px;z-index:3;display:flex;justify-content:flex-end;padding-top:8px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{background:#f3f4f6}.center{text-align:center}
canvas{width:100%;min-height:310px;background:white;border-radius:14px;border:1px solid var(--line)}.pill{display:inline-block;padding:8px 10px;background:#eef2ff;color:#3730a3;border-radius:999px;font-weight:800;margin:3px}.small{font-size:13px;color:var(--muted)}
.notice-list{margin:10px 0 0;padding-left:20px;line-height:1.75}.notice-check{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:white;margin-top:14px}.notice-check input{width:auto;margin-top:4px}.notice-check label{margin:0;font-size:14px;line-height:1.6;font-weight:700}
.timer-card{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.timer-display{font-size:28px;font-weight:900;letter-spacing:.02em}.locked-overlay{background:#111827;color:white;border-radius:22px;padding:28px;text-align:center;box-shadow:0 12px 30px rgba(17,24,39,.18);margin-bottom:18px}.locked-overlay h2{color:white;margin-bottom:8px}
@media(max-width:860px){header,.grid2,.row,.grid5,.choices{grid-template-columns:1fr;display:grid}header{align-items:start}.q{grid-template-columns:1fr}h1{font-size:27px}}
@media print{body{background:white}.no-print,.tabs,.warn,header .buttons{display:none!important}.wrap{max-width:none;padding:0}header{margin-bottom:8px}.card{box-shadow:none;break-inside:avoid;margin-bottom:10px}.sticky{display:none!important}canvas{max-width:100%;page-break-inside:avoid}table{font-size:12px}}
</style>
</head>

<script>
const QUESTIONS = [{ "id": 1, "a": "나는 가끔 문제해결의 책임을 상대방이 지도록 내버려둘 때도 있다.", "b": "나는 서로가 동의하지 않는 일들에 대해 협상하기보다, 서로가 동의하는 일들에 대해서 강조한다." }, { "id": 2, "a": "나는 절충안을 찾으려고 노력한다.", "b": "나는 상대방과 나의 관심사를 모두 충족시키려고 노력한다." }, { "id": 3, "a": "나는 대체로 나의 목표 달성을 위해 끝까지 밀고 나간다.", "b": "나는 상대방의 감정을 상하지 않게 하면서 서로간의 관계를 유지하기 위해 노력한다." }, { "id": 4, "a": "나는 절충안을 찾으려고 노력한다.", "b": "나는 때때로 상대방이 원하는 것을 위해 내가 원하는 것을 포기할 때가 있다." }, { "id": 5, "a": "나는 해결책을 찾아내기 위해 끊임없이 상대방에게 도움을 요청한다.", "b": "나는 불필요한 긴장 상태를 피하려고 노력한다." }, { "id": 6, "a": "나는 될 수 있는 한 불편한 관계/상황을 피하려고 한다.", "b": "나는 내 입장을 끝까지 주장하는 편이다." }, { "id": 7, "a": "나는 어떤 문제에 대해 충분히 생각할 시간이 있을 때까지 그것을 미루려고 한다.", "b": "나는 어떤 것을 얻는 대신 다른 것을 포기한다." }, { "id": 8, "a": "나는 대체로 나의 목표 달성을 위해 끝까지 밀고 나간다.", "b": "나는 모든 관심사와 문제들을 망설이지 않고 이야기한다." }, { "id": 9, "a": "나는 서로 의견이 다른 것에 대해서는 항상 신경 쓸 가치는 없다고 느낀다.", "b": "나는 내 방식대로 일을 처리하려고 노력한다." }, { "id": 10, "a": "나는 나의 목표 달성을 위해 끝까지 밀고 나간다.", "b": "나는 절충안을 찾으려고 노력한다." }, { "id": 11, "a": "나는 모든 관심사와 문제들을 망설이지 않고 이야기한다.", "b": "나는 상대방의 감정을 상하지 않게 하면서 서로간의 관계를 유지하기 위해 노력한다." }, { "id": 12, "a": "나는 때때로 논쟁을 일으킬 수 있는 입장에 서는 것을 피한다.", "b": "나의 입장을 상대방이 어느 정도 이해해 준다면 나도 상대방이 그들의 입장을 어느 정도 주장하도록 한다." }, { "id": 13, "a": "나는 대체로 절충안을 제안한다.", "b": "나는 내 의견을 관철시킨다." }, { "id": 14, "a": "나는 상대방에게도 내 생각을 말해주며 그 사람의 생각도 물어본다.", "b": "나는 상대방에게 내 의견의 논리적 근거와 장점을 설명해 주려고 한다." }, { "id": 15, "a": "나는 상대방의 감정을 상하지 않게 하면서 서로 간의 관계를 유지하기 위해 노력한다.", "b": "나는 불필요한 긴장 상태를 피하려고 노력한다." }, { "id": 16, "a": "나는 상대방의 감정을 상하지 않게 하려고 한다.", "b": "나는 상대방에게 내 입장의 장점을 설득시키려고 노력한다." }, { "id": 17, "a": "나는 대체로 나의 목표 달성을 위해 끝까지 밀고 나간다.", "b": "나는 불필요한 긴장 상태를 피하려고 노력한다." }, { "id": 18, "a": "나는 만약 상대방이 자신의 의견을 주장하는 것에 기쁨을 느낀다면, 그렇게 하도록 할 것이다.", "b": "나의 입장을 상대방이 어느 정도 이해해 준다면 나도 상대방이 그들의 입장을 어느 정도 주장하도록 한다." }, { "id": 19, "a": "나는 모든 관심사와 문제들을 망설이지 않고 이야기한다.", "b": "나는 어떤 문제에 대해서 충분히 생각할 시간이 있을 때까지 그것을 미루려고 한다." }, { "id": 20, "a": "나는 서로간의 의견 차이가 생기면 즉시 해결하려고 노력한다.", "b": "나는 이익과 손해에 대해 상호 모두에게 공정한 입장이 되려고 노력한다." }, { "id": 21, "a": "나는 협상해 나가는 과정에서 상대방이 바라는 것을 들어주려고 한다.", "b": "나는 항상 문제를 단도직입적으로 이야기하는 편이다." }, { "id": 22, "a": "나는 상대방과 내 입장 간의 중간 지점을 찾으려고 노력한다.", "b": "나는 내가 원하는 것을 주장한다." }, { "id": 23, "a": "나는 자주 우리 모두가 원하는 것을 만족시키는 데 관심을 가진다.", "b": "나는 가끔 문제 해결의 책임을 상대방이 지도록 내버려둘 때도 있다." }, { "id": 24, "a": "나는 만약 상대방이 자신의 입장이 매우 중요하다고 생각하면 그가 하고 싶은 것을 만족시켜주려고 노력한다.", "b": "나는 상대방이 절충안을 받아들일 수 있도록 노력한다." }, { "id": 25, "a": "나는 상대방에게 내 의견의 논리적 근거와 장점을 설명해 주려고 한다.", "b": "나는 협상해 나가는 과정에서 상대방이 바라는 것을 들어주려고 한다." }, { "id": 26, "a": "나는 절충안을 제안한다.", "b": "나는 거의 항상 우리 모두가 원하는 것을 만족시키는 데 관심을 가진다." }, { "id": 27, "a": "나는 때때로 논쟁을 일으킬 수 있는 입장에 서는 것을 피한다.", "b": "나는 만약 상대방이 자신의 의견을 주장하는 것에 기쁨을 느낀다면, 그렇게 하도록 할 것이다." }, { "id": 28, "a": "나는 대체로 나의 목표 달성을 위해 끝까지 밀고 나간다.", "b": "나는 보통 해결책을 찾아내기 위해 상대방의 도움을 요청한다." }, { "id": 29, "a": "나는 절충안을 제안한다.", "b": "나는 서로 의견이 다른 것에 대해서는 항상 신경 쓸 가치는 없다고 느낀다." }, { "id": 30, "a": "나는 상대방의 감정을 상하지 않게 하려고 한다.", "b": "나는 문제가 있으면 항상 상대방과 의논하여 해결하도록 한다." }];
const SCORING_KEY = { "1": { "A": "avoiding", "B": "accommodating" }, "2": { "A": "compromising", "B": "collaborating" }, "3": { "A": "competing", "B": "accommodating" }, "4": { "A": "compromising", "B": "accommodating" }, "5": { "A": "collaborating", "B": "avoiding" }, "6": { "A": "avoiding", "B": "competing" }, "7": { "A": "avoiding", "B": "compromising" }, "8": { "A": "competing", "B": "collaborating" }, "9": { "A": "avoiding", "B": "competing" }, "10": { "A": "competing", "B": "compromising" }, "11": { "A": "collaborating", "B": "accommodating" }, "12": { "A": "avoiding", "B": "compromising" }, "13": { "A": "compromising", "B": "competing" }, "14": { "A": "collaborating", "B": "competing" }, "15": { "A": "accommodating", "B": "avoiding" }, "16": { "A": "accommodating", "B": "competing" }, "17": { "A": "competing", "B": "avoiding" }, "18": { "A": "accommodating", "B": "compromising" }, "19": { "A": "collaborating", "B": "avoiding" }, "20": { "A": "collaborating", "B": "compromising" }, "21": { "A": "accommodating", "B": "collaborating" }, "22": { "A": "compromising", "B": "competing" }, "23": { "A": "collaborating", "B": "avoiding" }, "24": { "A": "accommodating", "B": "compromising" }, "25": { "A": "competing", "B": "accommodating" }, "26": { "A": "compromising", "B": "collaborating" }, "27": { "A": "avoiding", "B": "accommodating" }, "28": { "A": "competing", "B": "collaborating" }, "29": { "A": "compromising", "B": "avoiding" }, "30": { "A": "accommodating", "B": "collaborating" } };
const ORDER = ["competing", "collaborating", "compromising", "avoiding", "accommodating"];
const TYPES = {
    competing: { ko: "경쟁형", en: "Competing", short: "경쟁", desc: "자기주장성이 높고 타인수용성이 낮은 접근입니다.", tendency: "갈등을 목표 달성과 방향 결정의 장으로 보는 경향이 있습니다.", strength: ["긴급 상황에서 결정을 지연시키지 않습니다.", "중요한 원칙이 흔들릴 때 분명한 입장을 세웁니다.", "책임 소재가 불분명한 상황에서 주도성을 발휘합니다."], risk: ["상대가 눌렸다고 느낄 수 있습니다.", "관계적 신뢰보다 결과를 앞세우는 사람으로 보일 수 있습니다.", "구성원의 자발성이 약해질 수 있습니다."], growth: ["상대의 관심사를 한 문장으로 요약해 보세요.", "내가 옳다는 것과 상대가 납득했다는 것을 구분하세요.", "강한 결정 뒤에는 후속 설명을 마련하세요."], methods: ["결정 전 상대의 핵심 관심사를 확인하세요.", "결정 후 이유와 기대 행동을 설명하세요.", "사람이 아니라 문제와 기준을 분명히 세우세요."] },
    collaborating: { ko: "협력형", en: "Collaborating", short: "협력", desc: "자기주장성과 타인수용성이 모두 높은 접근입니다.", tendency: "갈등을 공동의 학습과 통합적 해결의 기회로 보는 경향이 있습니다.", strength: ["양쪽의 필요를 함께 살피며 신뢰를 강화합니다.", "복잡한 문제에서 통합적 대안을 만들 수 있습니다.", "상대가 존중받고 있다고 느끼게 합니다."], risk: ["시간이 많이 걸릴 수 있습니다.", "단순한 문제까지 과도하게 논의할 수 있습니다.", "상대가 협력 의지가 낮을 때 에너지를 소모할 수 있습니다."], growth: ["협력할 문제와 빠르게 결정할 문제를 구분하세요.", "대화의 목표와 시간을 정하세요.", "합의 후 실행 책임자를 정하세요."], methods: ["공동 목표와 결정 기준을 먼저 정하세요.", "상대 요구 뒤의 필요를 질문하세요.", "합의 후 점검 시점을 정하세요."] },
